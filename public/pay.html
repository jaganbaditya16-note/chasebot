<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChaseBot — Client Settlement</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18212f;background:#f5f7fb}body{margin:0}.wrap{max-width:820px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:22px;box-shadow:0 6px 20px #1720330a}.chat{min-height:300px;max-height:460px;overflow:auto;padding:8px}.msg{padding:12px 14px;border-radius:14px;margin:10px 0;max-width:82%;line-height:1.45}.bot{background:#eef3f8}.me{background:#111827;color:#fff;margin-left:auto}.row{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:13px;border:1px solid #d8dee8;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.summary{background:#f7f9fc;border-radius:12px;padding:14px;margin-top:14px}.good{background:#e9f8ef;color:#17683b}.warn{background:#fff7e5;color:#805a12}.small{color:#657184;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.link{color:#18212f}
</style></head><body><main class="wrap"><div class="top"><div><h1>ChaseBot</h1><p class="small">Secure settlement negotiation · PayPal Sandbox</p></div><a class="link" href="/">Dashboard</a></div><section class="card"><div id="invoice" class="summary">Loading invoice…</div><div id="chat" class="chat"></div><div class="row"><input id="message" placeholder="e.g. Can I get 20% off or split into 6 payments?" autocomplete="off"><button class="btn" id="send">Send</button></div><div id="offer"></div></section></main>
<script>
const qs=new URLSearchParams(location.search);let invoiceId=qs.get('invoice')||'INV-101';let lastIntent=null;let lastOffer=null;const chat=document.querySelector('#chat');const add=(text,me=false)=>{const d=document.createElement('div');d.className='msg '+(me?'me':'bot');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight};
async function load(){const r=await fetch('/api/invoices/'+invoiceId);if(!r.ok){document.querySelector('#invoice').textContent='Invoice not found';return}const x=await r.json();const i=x.invoice;document.querySelector('#invoice').innerHTML=`<b>${i.id}</b> · ${i.client}<br><strong>$${Number(i.outstanding).toFixed(2)}</strong> outstanding · max ${i.mandate.maxDiscountPct}% discount · max ${i.mandate.maxInstallments} payments`;if(qs.get('success')){add('Payment captured successfully. Your settlement is complete.');document.querySelector('#offer').innerHTML='<div class="summary good"><b>Payment complete.</b> The sandbox payment was captured and the invoice was updated.</div>'}else if(qs.get('cancelled')) add('The payment was cancelled. You can continue negotiating.');else if(!chat.children.length)add('Hi! I can help you request a settlement plan. The account rules limit the discount and number of installments.');}
async function negotiate(){const input=document.querySelector('#message');const message=input.value.trim();if(!message)return;add(message,true);input.value='';const r=await fetch(`/api/invoices/${invoiceId}/negotiate`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});const x=await r.json();if(!r.ok)return add(x.error||'Something went wrong.');lastIntent=x.intent;lastOffer=x.offer;add(x.reply);document.querySelector('#offer').innerHTML=`<div class="summary ${x.offer.countered?'warn':'good'}"><b>Server-approved offer</b><br>${x.offer.pct}% discount · ${x.offer.n} payment${x.offer.n===1?'':'s'} · first payment $${x.offer.parts[0].toFixed(2)}<br><span class="small">AI extracted intent; the deterministic rules engine set these terms.</span><br><button class="btn" style="margin-top:10px" onclick="acceptOffer()">Accept & pay</button></div>`}
async function acceptOffer(){const r=await fetch(`/api/invoices/${invoiceId}/accept`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent:lastIntent})});const x=await r.json();if(!r.ok)return add(x.error||'Could not create payment.');location.href=x.orders[0].url;}
document.querySelector('#send').onclick=negotiate;document.querySelector('#message').addEventListener('keydown',e=>{if(e.key==='Enter')negotiate()});load();
</script></body></html>
