name: ChaseBot CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node -e "const h=require('./api/index.js'); console.log(typeof h === 'function' ? 'API handler OK' : 'API handler missing')"
